  # ---------------- Températures par rôle (selon l'affectation) ----------------
  - platform: template
    id: t_ext
    name: "T air neuf (extérieur)"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_ext).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_insuf
    name: "T insufflation"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_insuf).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_rep
    name: "T reprise (air extrait)"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_rep).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
