    id: etal_qs25
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit soufflage mesuré à 25 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 1
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qs50
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit soufflage mesuré à 50 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 2
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qs75
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit soufflage mesuré à 75 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 3
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qs100
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit soufflage mesuré à 100 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 4
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe25
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit extraction mesuré à 25 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 5
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe50
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit extraction mesuré à 50 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 6
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe75
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit extraction mesuré à 75 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 7
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe100
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit extraction mesuré à 100 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 8
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  # Consignes de dépression par mode (mesurées au caisson, capteur Huba).
  # Bouches hygro B : 80-160 Pa à la bouche ; les gaines font perdre quelques Pa.
  - platform: template
    id: consigne_eco
    name: "Consigne Éco"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 2.1
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 90
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: consigne_pression
    name: "Consigne Confort"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 2.2
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 125
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: consigne_boost
    name: "Consigne Boost"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 2.3
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 170
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: suivi_ecart
    name: "Soufflage – écart / extraction"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 5
    unit_of_measurement: "%"
    min_value: -30
    max_value: 30
    step: 1
    initial_value: -5
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: debit
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Débit estimé"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 1
    unit_of_measurement: "m³/h"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 120
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: prix_kwh
    name: "Prix du kWh électrique"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 4
    unit_of_measurement: "€/kWh"
    mode: box
    min_value: 0.05
    max_value: 1.0
    step: 0.001
    initial_value: 0.21
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: cop_chauffage
    # 1 = radiateurs électriques ; 3-4 = clim / PAC air-air ; 3 = PAC air-eau ;
    # poêle à granulés : 0,9 et mettre le prix du kWh granulés dans "Prix du kWh électrique"
    name: "COP du chauffage remplacé"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 5
    mode: box
    min_value: 1
    max_value: 6
    step: 0.1
    initial_value: 3.5
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: v_souff
    name: "Vitesse soufflage"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 1
    icon: mdi:fan
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          // curseur bougé à la main en Éco/Confort/Boost -> passage en Manuel (et il y reste)
          if (!id(regul_ecrit)) {
            auto m = id(mode_ventil).active_index();
            if (m.has_value() && *m != 0)
              id(mode_ventil).make_call().set_option("Manuel").perform();
          }
      - output.set_level:
          id: pwm_souff
          level: !lambda |-
            float pct = x - id(antigel_red);                 // antigel : soufflage réduit
            if (pct < 10) pct = 10;
            // Consigne x % -> tension visée sur le fil JAUNE (10 % = 1 V ... 100 % = 10 V)
            const float RPU = ${r_pullup}, RE = ${r_emetteur}, RI = 100000.0f;  // RI = entrée moteur
            const float v_open = 10.0f * RI / (RI + RPU);   // jaune si transistor bloqué (~9,1 V)
            const float r_th = RPU * RI / (RPU + RI);
            float vy = pct / 10.0f;                            // tension jaune visée
            if (vy >= v_open) return 1.0f;                   // 100 % : DAC 0 V (sortie inversée)
            float i = (v_open - vy) / r_th;                  // courant à tirer par le transistor
            float vdac = 0.65f + i * RE;                     // tension DAC nécessaire (Vbe ~0,65 V)
            float lvl = vdac / 3.3f;
            if (lvl > 1.0f) lvl = 1.0f;
            return 1.0f - lvl;                               // output en inverted: true

  - platform: template
    id: v_extr
    name: "Vitesse extraction"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 2
    icon: mdi:fan
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          // curseur bougé à la main pendant une régulation auto -> passage en Manuel (et il y reste)
          if (!id(regul_ecrit)) {
            auto m = id(mode_ventil).active_index();
            if (m.has_value() && *m != 0)
              id(mode_ventil).make_call().set_option("Manuel").perform();
          }
      - output.set_level:
          id: pwm_extr
          level: !lambda |-
            float pct = x;
            { auto m = id(mode_ventil).active_index();         // antigel en mode Manuel : + extraction
              if (!m.has_value() || *m == 0) pct = x + 0.5f * id(antigel_red); }
            if (pct > 100) pct = 100;
            // Consigne x % -> tension visée sur le fil JAUNE (10 % = 1 V ... 100 % = 10 V)
            const float RPU = ${r_pullup}, RE = ${r_emetteur}, RI = 100000.0f;  // RI = entrée moteur
            const float v_open = 10.0f * RI / (RI + RPU);   // jaune si transistor bloqué (~9,1 V)
            const float r_th = RPU * RI / (RPU + RI);
            float vy = pct / 10.0f;                            // tension jaune visée
            if (vy >= v_open) return 1.0f;                   // 100 % : DAC 0 V (sortie inversée)
            float i = (v_open - vy) / r_th;                  // courant à tirer par le transistor
            float vdac = 0.65f + i * RE;                     // tension DAC nécessaire (Vbe ~0,65 V)
            float lvl = vdac / 3.3f;
            if (lvl > 1.0f) lvl = 1.0f;
            return 1.0f - lvl;                               // output en inverted: true

select:
  # Manuel : les deux vitesses se règlent à la main ; Éco / Confort / Boost : extraction
  # à pression constante (une consigne par mode) et soufflage qui suit l'extraction.
  - platform: template
    id: mode_ventil
    name: "Mode de ventilation"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 1
    icon: mdi:fan-auto
    options: ["Manuel", "Éco", "Confort", "Boost"]
    initial_option: "Confort"
    restore_value: true
    optimistic: true

  - platform: template
    id: sel_ext
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Affectation – air neuf (extérieur)"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 5
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 1"
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: sel_insuf
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Affectation – insufflation"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 6
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 2"
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: sel_rep
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Affectation – reprise (air extrait)"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 7
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 3"
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: sel_rejet
    internal: true           # réglable seulement depuis la page web de l'ESP (pas dans Home Assistant)
    name: "Affectation – rejet"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 8
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 4"
    restore_value: true
    optimistic: true
    entity_category: config

sensor:
  # ---------- Débits calculés à partir de l'étalonnage (0 = non étalonné) ----------
  - platform: template
    id: q_souff
    name: "Débit soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 9
    icon: mdi:weather-windy
    unit_of_measurement: "m³/h"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // Courbe d'étalonnage : points (vitesse %, débit) saisis (0 = non saisi), interpolation linéaire.
      // En dehors des points : proportionnel à la vitesse (loi des ventilateurs) depuis le point le plus proche.
      const float P[4] = {25, 50, 75, 100};
      const float Q[4] = {id(etal_qs25).state, id(etal_qs50).state, id(etal_qs75).state, id(etal_qs100).state};
      float px[4], qy[4]; int n = 0;
      for (int k = 0; k < 4; k++) if (!isnan(Q[k]) && Q[k] > 0) { px[n] = P[k]; qy[n] = Q[k]; n++; }
      float pct = id(v_souff).state - id(antigel_red)   /* vitesse réellement envoyée */;
      if (pct < 10) pct = 10; if (pct > 100) pct = 100;
      if (n == 0) return id(debit).state * pct / 100.0f;   // rien de saisi : débit estimé (= débit à 100 %) × vitesse
      if (pct <= px[0]) return qy[0] * pct / px[0];
      if (pct >= px[n-1]) return qy[n-1] * pct / px[n-1];
      for (int k = 0; k < n - 1; k++)
        if (pct <= px[k+1]) return qy[k] + (pct - px[k]) * (qy[k+1] - qy[k]) / (px[k+1] - px[k]);
      return qy[n-1];
    filters:
      - or:
          - throttle: 300s
          - delta: 2
  - platform: template
    id: q_extr
    name: "Débit extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 10
    icon: mdi:weather-windy
    unit_of_measurement: "m³/h"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // Courbe d'étalonnage : points (vitesse %, débit) saisis (0 = non saisi), interpolation linéaire.
      // En dehors des points : proportionnel à la vitesse (loi des ventilateurs) depuis le point le plus proche.
      const float P[4] = {25, 50, 75, 100};
      const float Q[4] = {id(etal_qe25).state, id(etal_qe50).state, id(etal_qe75).state, id(etal_qe100).state};
      float px[4], qy[4]; int n = 0;
      for (int k = 0; k < 4; k++) if (!isnan(Q[k]) && Q[k] > 0) { px[n] = P[k]; qy[n] = Q[k]; n++; }
      if (n == 0) { float r = id(rapport_debits).state, qs = id(q_souff).state; return (isnan(r) || isnan(qs)) ? NAN : qs * r; }
      float pct = id(v_extr).state;
      if (pct < 10) pct = 10; if (pct > 100) pct = 100;
      if (pct <= px[0]) return qy[0] * pct / px[0];
      if (pct >= px[n-1]) return qy[n-1] * pct / px[n-1];
      for (int k = 0; k < n - 1; k++)
        if (pct <= px[k+1]) return qy[k] + (pct - px[k]) * (qy[k+1] - qy[k]) / (px[k+1] - px[k]);
      return qy[n-1];
    filters:
      - or:
          - throttle: 300s
          - delta: 2
  - platform: template
    name: "Antigel – baisse du soufflage"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 9
    icon: mdi:snowflake-melt
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(antigel_red);
  # Au 1er démarrage, relever les adresses dans les logs puis les coller ici.
  # ---------------- Sondes brutes (ordre de détection sur le bus) ----------------
  # Affectation des rôles depuis la page web / HA (section "Sondes") : chauffer une
  # sonde entre les doigts, repérer laquelle monte, et choisir le bon rôle.
