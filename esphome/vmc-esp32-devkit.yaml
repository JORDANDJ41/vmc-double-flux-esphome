  - platform: template
    id: t_rejet
    name: "T rejet"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 4
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_rejet).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
