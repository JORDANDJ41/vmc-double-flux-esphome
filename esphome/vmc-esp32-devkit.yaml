  # ---------------- Diagnostic ----------------
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 2
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Temps de fonctionnement"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3
    entity_category: diagnostic

  # ---------------- Capteur de pression Huba (air neuf) ----------------
  # Sortie 0,5-4,5 V = 0-300 Pa. Pont diviseur /4 (3 x 4,7k en haut, 1 x 4,7k en bas)
  # Fil JAUNE -> pont -> GPIO34 ; fil VERT -> GND ESP32. Ne JAMAIS relier le BLEU (12 V).
  - platform: adc
    id: huba_v
    pin: GPIO34
    name: "Capteur pression – tension"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 1
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 4.0          # rapport du pont diviseur
      - sliding_window_moving_average:
          window_size: 6
          send_every: 3

  - platform: template
    id: p_extraction
    name: "Pression réseau extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 6
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float v = id(huba_v).state;
      if (isnan(v) || v > 5.5f) return NAN;      // > 5,5 V : mauvais fil (12 V)
      float p = (v - 0.5f) / 4.0f * 300.0f;       // 0,5-4,5 V -> 0-300 Pa
      return p < 0 ? 0.0f : p;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  # Consigne de dépression appliquée (selon le mode) ; vide en Manuel
  - platform: template
    id: consigne_active
    name: "Consigne extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 6.1
    icon: mdi:target
    unit_of_measurement: "Pa"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      auto mv = id(mode_ventil).active_index();
      int md = mv.has_value() ? (int) *mv : 2;
      if (md == 0) return NAN;                                // Manuel : pas de consigne
      float c = md == 1 ? id(consigne_eco).state : (md == 3 ? id(consigne_boost).state : id(consigne_pression).state);
      return c + 0.5f * id(antigel_red);
    filters:
      - or:
          - throttle: 300s
          - delta: 1
  - platform: template
    id: filtre_jours
    name: "Filtres – jours d'utilisation"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 5
    unit_of_measurement: "j"
    icon: mdi:air-filter
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(filtre_heures) / 24.0f;

  - platform: template
    id: eta_souff
    name: "Rendement côté soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 2
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      return 100.0f * (id(t_insuf).state - id(t_ext).state) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    id: eta_extr
    name: "Rendement côté extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 3
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      return 100.0f * (id(t_rep).state - id(t_rejet).state) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    name: "Rendement moyen 1 h"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 1
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(eta_souff).state;
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 60
          send_every: 5

  # Écart entre les deux rendements : indicateur de déséquilibre / encrassement d'un côté
  - platform: template
    name: "Écart rendements"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 4
    unit_of_measurement: "pts"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      float gain  = id(t_insuf).state - id(t_ext).state;
      float perte = id(t_rep).state - id(t_rejet).state;
      return 100.0f * (gain - perte) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  # Rapport des débits extraction / soufflage, par bilan thermique de l'échangeur
  # 1,0 = équilibré ; > 1 = plus d'extraction que de soufflage (maison en dépression)
  - platform: template
    id: rapport_debits
    name: "Rapport débits extraction sur soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 5
    icon: mdi:scale-balance
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      float gain  = id(t_insuf).state - id(t_ext).state;
      float perte = id(t_rep).state - id(t_rejet).state;
      if (isnan(gain) || isnan(perte) || perte < 0.5f) return NAN;
      return gain / perte;
    filters:
      - sliding_window_moving_average:
          window_size: 20
          send_every: 4

  - platform: template
    id: p_recup
    name: "Puissance récupérée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 7
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // P ≈ 0,34 × Q_soufflage (étalonné) × (T_insuf - T_ext)
      float p = 0.34f * id(q_souff).state * (id(t_insuf).state - id(t_ext).state);
      return p > 0 ? p : 0.0f;
    filters:
      - or:
          - throttle: 300s
          - delta: 5

  - platform: integration
    id: e_recup
    sensor: p_recup
    name: "Énergie récupérée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 8
    time_unit: h
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    restore: true

  # Économie : chaleur récupérée = chauffage évité. Électricité évitée = énergie récupérée / COP
  # du chauffage remplacé (1 = radiateurs, 3-4 = clim/PAC), multipliée par le prix du kWh.
  # Calculée sur toute l'énergie récupérée : se recalcule si le prix ou le COP change.
  - platform: template
    id: eco_euros
    name: "Économie estimée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 8.5
    icon: mdi:piggy-bank-outline
    unit_of_measurement: "€"
    accuracy_decimals: 2
    device_class: monetary
    state_class: total
    update_interval: 60s
    lambda: |-
      float e = id(e_recup).state, cop = id(cop_chauffage).state, prix = id(prix_kwh).state;
      if (isnan(e) || isnan(cop) || cop < 1 || isnan(prix)) return NAN;
      return e / 1000.0f / cop * prix;      // e_recup est en Wh

