# =====================================================================
#  VMC double flux (Atlantic Duocosy HR HY) — version ESP32 DevKit + platine
#  Supervision (4 x DS18B20, pression Huba) + commande 0-10 V "bricolée"
#  par DAC + transistor 2N2222 tirant le fil jaune contre une résistance
#  de tirage (WAGO rouge->jaune, 9,1 kOhm).
#
#  /!\ Version de transition : voir docs/cablage-esp32-devkit.md et les
#      avertissements du README. Pour du pilotage, préférer vmc-kincony-a6.yaml.
#
#  Brochage : DS18B20 sur GPIO4 (tirage 4,7 kOhm), Huba sur GPIO34 via pont
#  diviseur /4, DAC GPIO25 (soufflage) et GPIO26 (extraction).
# =====================================================================

substitutions:
  delta_min: "6.0"        # écart T_rep - T_ext mini pour un rendement exploitable (°C)
  # Étage moteur : résistance WAGO rouge->jaune (côté moteur) et résistance d'émetteur (platine)
  r_pullup: "9100.0"
  r_emetteur: "2200.0"

esphome:
  name: vmc
  friendly_name: VMC
  on_boot:
    priority: -100
    then:
      - component.update: filtre_jours
      - number.set:
          id: v_souff
          value: !lambda return id(v_souff).state;
      - number.set:
          id: v_extr
          value: !lambda return id(v_extr).state;

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret vmc_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VMC Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------------
#  Page web locale : http://<adresse-IP-de-l-ESP>  (ou http://NOM.local)
#  Fonctionne sans Home Assistant ni Internet.
# ---------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  # local: false (par défaut) : nécessaire pour que js_include soit chargé.
  # Le schéma est servi par l'ESP et marche sans Internet ; seule la page
  # de configuration ESPHome (bouton Configurer) charge son interface depuis Internet.
  js_include: "vmc_synoptique.js"   # schéma de la VMC (fichier à placer dans /config/esphome/)
  # auth:                # à activer pour un client :
  #   username: admin
  #   password: "choisir_un_mot_de_passe"
  sorting_groups:
    - id: grp_temp
      name: "Températures"
      sorting_weight: 10
    - id: grp_perf
      name: "Performances"
      sorting_weight: 20
    - id: grp_cmd
      name: "Commande ventilateurs"
      sorting_weight: 30
    - id: grp_alert
      name: "Alertes et filtres"
      sorting_weight: 40
    - id: grp_reglages
      name: "Réglages"
      sorting_weight: 50
    - id: grp_sondes
      name: "Sondes – affectation"
      sorting_weight: 55
    - id: grp_diag
      name: "Diagnostic"
      sorting_weight: 60

one_wire:
  - platform: gpio
    pin: GPIO4

# ---------------------------------------------------------------------
#  Compteur filtres : heures d'utilisation depuis le dernier changement
#  (enregistré en mémoire flash une fois par heure, conservé au redémarrage)
# ---------------------------------------------------------------------
globals:
  - id: filtre_heures
    type: uint32_t
    restore_value: true
    initial_value: '0'

interval:
  - interval: 1h
    then:
      - lambda: |-
          id(filtre_heures) += 1;
      - component.update: filtre_jours

# ---------------------------------------------------------------------
#  Commande des 2 moteurs ebm-papst — sorties ANALOGIQUES (DAC) GPIO25/26
#  Étage : GPIO -[4,7k]- base 2N2222 ; collecteur = fil JAUNE moteur ;
#          émetteur -[2 x 4,7k en parallèle]- GND ; fil BLEU moteur = GND.
#  DAC 0 V  -> transistor bloqué -> fil jaune à 10 V -> pleine vitesse.
#  DAC haut -> transistor conduit -> tension du jaune baisse -> moteur ralentit
#                                    (trop bas = ARRÊT du moteur !)
#  inverted: true -> niveau 1.0 = DAC 0 V = 100 %
#  PHASE D'ÉTALONNAGE : curseurs bruts 0-100 %, à recaler après mesures.
# ---------------------------------------------------------------------
output:
  - platform: esp32_dac
    id: pwm_souff
    pin: GPIO25
    inverted: true
  - platform: esp32_dac
    id: pwm_extr
    pin: GPIO26
    inverted: true

# Débit estimé : à régler depuis HA (idéalement avec une mesure aux bouches)
number:
  - platform: template
    id: debit
    name: "Débit estimé"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 1
    unit_of_measurement: "m³/h"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 120
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: filtre_seuil
    name: "Filtres – seuil de changement"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 2
    unit_of_measurement: "j"
    min_value: 30
    max_value: 400
    step: 15
    initial_value: 180
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: v_souff
    name: "Vitesse soufflage"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 1
    icon: mdi:fan
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - output.set_level:
          id: pwm_souff
          level: !lambda |-
            // Consigne x % -> tension visée sur le fil JAUNE (10 % = 1 V ... 100 % = 10 V)
            const float RPU = ${r_pullup}, RE = ${r_emetteur}, RI = 100000.0f;  // RI = entrée moteur
            const float v_open = 10.0f * RI / (RI + RPU);   // jaune si transistor bloqué (~9,1 V)
            const float r_th = RPU * RI / (RPU + RI);
            float vy = x / 10.0f;                            // tension jaune visée
            if (vy >= v_open) return 1.0f;                   // 100 % : DAC 0 V (sortie inversée)
            float i = (v_open - vy) / r_th;                  // courant à tirer par le transistor
            float vdac = 0.65f + i * RE;                     // tension DAC nécessaire (Vbe ~0,65 V)
            float lvl = vdac / 3.3f;
            if (lvl > 1.0f) lvl = 1.0f;
            return 1.0f - lvl;                               // output en inverted: true

  - platform: template
    id: v_extr
    name: "Vitesse extraction"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 2
    icon: mdi:fan
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - output.set_level:
          id: pwm_extr
          level: !lambda |-
            // Consigne x % -> tension visée sur le fil JAUNE (10 % = 1 V ... 100 % = 10 V)
            const float RPU = ${r_pullup}, RE = ${r_emetteur}, RI = 100000.0f;  // RI = entrée moteur
            const float v_open = 10.0f * RI / (RI + RPU);   // jaune si transistor bloqué (~9,1 V)
            const float r_th = RPU * RI / (RPU + RI);
            float vy = x / 10.0f;                            // tension jaune visée
            if (vy >= v_open) return 1.0f;                   // 100 % : DAC 0 V (sortie inversée)
            float i = (v_open - vy) / r_th;                  // courant à tirer par le transistor
            float vdac = 0.65f + i * RE;                     // tension DAC nécessaire (Vbe ~0,65 V)
            float lvl = vdac / 3.3f;
            if (lvl > 1.0f) lvl = 1.0f;
            return 1.0f - lvl;                               // output en inverted: true

select:
  - platform: template
    id: sel_ext
    name: "Affectation – air neuf (extérieur)"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 5
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 1"
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: sel_insuf
    name: "Affectation – insufflation"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 6
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 2"
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: sel_rep
    name: "Affectation – reprise (air extrait)"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 7
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 3"
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: sel_rejet
    name: "Affectation – rejet"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 8
    options: ["Sonde 1", "Sonde 2", "Sonde 3", "Sonde 4"]
    initial_option: "Sonde 4"
    restore_value: true
    optimistic: true
    entity_category: config

sensor:
  # Au 1er démarrage, relever les adresses dans les logs puis les coller ici.
  # ---------------- Sondes brutes (ordre de détection sur le bus) ----------------
  # Affectation des rôles depuis la page web / HA (section "Sondes") : chauffer une
  # sonde entre les doigts, repérer laquelle monte, et choisir le bon rôle.
  - platform: dallas_temp
    id: sonde_1
    name: "Sonde 1"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 1
    index: 0
    update_interval: 15s
    entity_category: diagnostic
  - platform: dallas_temp
    id: sonde_2
    name: "Sonde 2"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 2
    index: 1
    update_interval: 15s
    entity_category: diagnostic
  - platform: dallas_temp
    id: sonde_3
    name: "Sonde 3"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 3
    index: 2
    update_interval: 15s
    entity_category: diagnostic
  - platform: dallas_temp
    id: sonde_4
    name: "Sonde 4"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 4
    index: 3
    update_interval: 15s
    entity_category: diagnostic

  # ---------------- Températures par rôle (selon l'affectation) ----------------
  - platform: template
    id: t_ext
    name: "T air neuf (extérieur)"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_ext).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_insuf
    name: "T insufflation"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_insuf).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_rep
    name: "T reprise (air extrait)"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_rep).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_rejet
    name: "T rejet"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 4
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_rejet).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1

  # ---------------- Diagnostic ----------------
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 2
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Temps de fonctionnement"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3
    entity_category: diagnostic

  # ---------------- Capteur de pression Huba (air neuf) ----------------
  # Sortie 0,5-4,5 V = 0-300 Pa. Pont diviseur /4 (3 x 4,7k en haut, 1 x 4,7k en bas)
  # Fil JAUNE -> pont -> GPIO34 ; fil VERT -> GND ESP32. Ne JAMAIS relier le BLEU (12 V).
  - platform: adc
    id: huba_v
    pin: GPIO34
    name: "Capteur pression – tension"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 1
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 4.0          # rapport du pont diviseur
      - sliding_window_moving_average:
          window_size: 6
          send_every: 3

  - platform: template
    id: p_extraction
    name: "Pression réseau extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 6
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float v = id(huba_v).state;
      if (isnan(v) || v > 5.5f) return NAN;      // > 5,5 V : mauvais fil (12 V)
      float p = (v - 0.5f) / 4.0f * 300.0f;       // 0,5-4,5 V -> 0-300 Pa
      return p < 0 ? 0.0f : p;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    id: filtre_jours
    name: "Filtres – jours d'utilisation"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 5
    unit_of_measurement: "j"
    icon: mdi:air-filter
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(filtre_heures) / 24.0f;

  - platform: template
    id: eta_souff
    name: "Rendement côté soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 2
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      return 100.0f * (id(t_insuf).state - id(t_ext).state) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    id: eta_extr
    name: "Rendement côté extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 3
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      return 100.0f * (id(t_rep).state - id(t_rejet).state) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    name: "Rendement moyen 1 h"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 1
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(eta_souff).state;
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 60
          send_every: 5

  # Écart entre les deux rendements : indicateur de déséquilibre / encrassement d'un côté
  - platform: template
    name: "Écart rendements"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 4
    unit_of_measurement: "pts"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      float gain  = id(t_insuf).state - id(t_ext).state;
      float perte = id(t_rep).state - id(t_rejet).state;
      return 100.0f * (gain - perte) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  # Rapport des débits extraction / soufflage, par bilan thermique de l'échangeur
  # 1,0 = équilibré ; > 1 = plus d'extraction que de soufflage (maison en dépression)
  - platform: template
    id: rapport_debits
    name: "Rapport débits extraction sur soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 5
    icon: mdi:scale-balance
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      float gain  = id(t_insuf).state - id(t_ext).state;
      float perte = id(t_rep).state - id(t_rejet).state;
      if (isnan(gain) || isnan(perte) || perte < 0.5f) return NAN;
      return gain / perte;
    filters:
      - sliding_window_moving_average:
          window_size: 20
          send_every: 4

  - platform: template
    id: p_recup
    name: "Puissance récupérée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 7
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // P ≈ 0,34 × Q × (T_insuf - T_ext)
      float p = 0.34f * id(debit).state * (id(t_insuf).state - id(t_ext).state);
      return p > 0 ? p : 0.0f;
    filters:
      - or:
          - throttle: 300s
          - delta: 5

  - platform: integration
    id: e_recup
    sensor: p_recup
    name: "Énergie récupérée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 8
    time_unit: h
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    restore: true

binary_sensor:
  - platform: template
    name: "By-pass probablement ouvert"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 3
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return false;
      return id(eta_souff).state < 30.0f;
    filters:
      - delayed_on: 10min

  - platform: template
    name: "Risque givrage échangeur"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 2
    device_class: cold
    lambda: |-
      return id(t_rejet).state < 1.0f;
    filters:
      - delayed_on: 5min

  - platform: template
    name: "Air soufflé froid"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 1
    device_class: cold
    lambda: |-
      return id(t_insuf).state < 15.0f;
    filters:
      - delayed_on: 10min


  - platform: template
    name: "Filtres à changer"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 4
    device_class: problem
    icon: mdi:air-filter
    lambda: |-
      return (id(filtre_heures) / 24.0f) >= id(filtre_seuil).state;

button:
  - platform: template
    name: "Remise à zéro énergie récupérée"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 3
    entity_category: config
    on_press:
      - sensor.integration.reset: e_recup

  - platform: template
    name: "Filtres changés (remise à zéro)"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 6
    icon: mdi:air-filter
    on_press:
      - lambda: |-
          id(filtre_heures) = 0;
          global_preferences->sync();
      - component.update: filtre_jours

