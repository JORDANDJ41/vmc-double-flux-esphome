# =====================================================================
#  VMC double flux (Atlantic Duocosy HR HY) — version ESP32 DevKit + platine
#  Supervision (4 x DS18B20, pression Huba) + commande 0-10 V "bricolée"
#  par DAC + transistor 2N2222 tirant le fil jaune contre une résistance
#  de tirage (WAGO rouge->jaune, 9,1 kOhm).
#
#  /!\ Version de transition : voir docs/cablage-esp32-devkit.md et les
#      avertissements du README. Pour du pilotage, préférer vmc-kincony-a6.yaml.
#
#  Brochage : DS18B20 sur GPIO4 (tirage 4,7 kOhm), Huba sur GPIO34 via pont
#  diviseur /4, DAC GPIO25 (soufflage) et GPIO26 (extraction).
# =====================================================================

substitutions:
  # Réglages fixes (non modifiables depuis Home Assistant)
  antigel_seuil: "1.0"     # antigel : T rejet mini (°C)
  antigel_max: "40.0"      # antigel : baisse maxi du soufflage (%)
  filtre_seuil: "365"      # filtres : durée avant changement (jours) — 1 fois par an (préconisation constructeur)
  pi_gain: "0.05"          # régulation pression : réactivité (%/Pa)
  delta_min: "6.0"        # écart T_rep - T_ext mini pour un rendement exploitable (°C)
  # Étage moteur : résistance WAGO rouge->jaune (côté moteur) et résistance d'émetteur (platine)
  r_pullup: "9100.0"
  r_emetteur: "2200.0"

esphome:
  name: vmc
  friendly_name: VMC
  on_boot:
    priority: -100
    then:
      - component.update: filtre_jours
      - lambda: id(regul_ecrit) = true;
      - number.set:
          id: v_souff
          value: !lambda return id(v_souff).state;
      - number.set:
          id: v_extr
          value: !lambda return id(v_extr).state;
      - lambda: id(regul_ecrit) = false;

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s       # ne pas redémarrer l'ESP s'il n'y a pas de Home Assistant (utilisation autonome)
  encryption:
    key: !secret vmc_api_key

ota:
  - platform: esphome
    encryption:            # chiffrement des mises à jour sans fil (ajouté par ESPHome Builder ; évite la question à chaque installation)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    # Wi-Fi de secours : créé si l'ESP n'arrive pas à joindre le Wi-Fi pendant 1 min.
    # S'y connecter avec un téléphone : une page s'ouvre pour choisir un nouveau Wi-Fi.
    ssid: "VMC double flux"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------------
#  Page web locale : http://<adresse-IP-de-l-ESP>  (ou http://NOM.local)
#  Fonctionne sans Home Assistant ni Internet.
# ---------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  # local: false (par défaut) : nécessaire pour que js_include soit chargé.
  # Le schéma est servi par l'ESP et marche sans Internet ; seule la page
  # de configuration ESPHome (bouton Configurer) charge son interface depuis Internet.
  js_include: "vmc_synoptique.js"   # schéma de la VMC (fichier à placer dans /config/esphome/)
  include_internal: true            # entités internes (affectation des sondes) visibles seulement sur la page web
  # auth:                # à activer pour un client :
  #   username: admin
  #   password: "choisir_un_mot_de_passe"
  sorting_groups:
    - id: grp_temp
      name: "Températures"
      sorting_weight: 10
    - id: grp_perf
      name: "Performances"
      sorting_weight: 20
    - id: grp_cmd
      name: "Commande ventilateurs"
      sorting_weight: 30
    - id: grp_regul
      name: "Régulation automatique"
      sorting_weight: 35
    - id: grp_alert
      name: "Alertes et filtres"
      sorting_weight: 40
    - id: grp_debits
      name: "Étalonnage des débits"
      sorting_weight: 48
    - id: grp_reglages
      name: "Réglages"
      sorting_weight: 50
    - id: grp_sondes
      name: "Sondes – affectation"
      sorting_weight: 55
    - id: grp_diag
      name: "Diagnostic"
      sorting_weight: 60

one_wire:
  - platform: gpio
    pin: GPIO4

# ---------------------------------------------------------------------
#  Compteur filtres : heures d'utilisation depuis le dernier changement
#  (enregistré en mémoire flash une fois par heure, conservé au redémarrage)
# ---------------------------------------------------------------------
# Heure : celle de Home Assistant, sinon Internet (SNTP) si l'ESP tourne seul.
# Sert à dater les remises à zéro (énergie, filtres).
time:
  - platform: homeassistant
    id: horloge
  - platform: sntp
    id: horloge_sntp

globals:
  - id: energie_depuis     # date (epoch) de la dernière remise à zéro de l'énergie
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: filtres_depuis     # date (epoch) du dernier changement de filtres
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: antigel_red        # réduction du soufflage par l'antigel (%)
    type: float
    restore_value: false
    initial_value: '0'
  - id: regul_ecrit        # vrai quand c'est la régulation (et non l'utilisateur) qui bouge un curseur
    type: bool
    initial_value: 'false'
  - id: pi_mem_err
    type: float
    initial_value: '0'
  - id: filtre_heures
    type: uint32_t
    restore_value: true
    initial_value: '0'

script:
  - id: appliquer_moteurs        # recalcule les sorties 0-10 V (après un changement d'antigel)
    then:
      - lambda: id(regul_ecrit) = true;
      - number.set:
          id: v_souff
          value: !lambda return id(v_souff).state;
      - number.set:
          id: v_extr
          value: !lambda return id(v_extr).state;
      - lambda: id(regul_ecrit) = false;

interval:
  # ---------- Antigel progressif ----------
  # T rejet sous le seuil -> on baisse le soufflage de 5 % par minute (jusqu'à la baisse maxi)
  # et on augmente l'extraction. On revient de 5 %/min quand T rejet repasse 2 °C au-dessus.
  - interval: 1min
    then:
      - lambda: |-
          float tr = id(t_rejet).state;
          if (isnan(tr)) return;
          float r = id(antigel_red);
          if (tr < ${antigel_seuil}) r += 5;
          else if (tr > ${antigel_seuil} + 2.0f) r -= 5;
          if (r > ${antigel_max}) r = ${antigel_max};
          if (r < 0) r = 0;
          if (r != id(antigel_red)) {
            id(antigel_red) = r;
            ESP_LOGW("antigel", "T rejet %.1f °C -> soufflage -%.0f %%", tr, r);
            id(appliquer_moteurs).execute();
          }
  # ---------- Extraction à pression constante (régulateur PI incrémental) ----------
  # Pression trop basse (bouches qui s'ouvrent) -> on accélère ; trop haute -> on ralentit.
  - interval: 5s
    then:
      - lambda: |-
          // Mode de ventilation : 0 = Manuel, 1 = Éco, 2 = Confort, 3 = Boost
          auto mv = id(mode_ventil).active_index();
          int md = mv.has_value() ? (int) *mv : 2;
          if (md == 0) { id(pi_mem_err) = 0; return; }           // Manuel : vitesse d'extraction fixe
          float p = id(p_extraction).state;
          if (isnan(p)) return;                                  // capteur absent : on ne touche à rien
          float c = md == 1 ? id(consigne_eco).state : (md == 3 ? id(consigne_boost).state : id(consigne_pression).state);
          c += 0.5f * id(antigel_red);                              // antigel : + extraction
          float err = c - p;                                        // >0 : pas assez de dépression
          if (fabsf(err) < 3.0f) err = 0;                         // zone morte ±3 Pa
          float k = ${pi_gain};
          float delta = k * err + 4.0f * k * (err - id(pi_mem_err));   // I + P (forme incrémentale)
          id(pi_mem_err) = err;
          if (delta > 3.0f) delta = 3.0f; if (delta < -3.0f) delta = -3.0f;   // 3 %/5 s maxi
          float v = id(v_extr).state + delta;
          if (v < 10) v = 10; if (v > 100) v = 100;
          if (fabsf(v - id(v_extr).state) >= 0.5f)
            { id(regul_ecrit) = true; id(v_extr).make_call().set_value(roundf(v)).perform(); id(regul_ecrit) = false; }
          // Éco / Confort / Boost : le soufflage suit l'extraction (+ écart réglable)
          {
            float vs = roundf(v + id(suivi_ecart).state);
            if (vs < 10) vs = 10; if (vs > 100) vs = 100;
            if (fabsf(vs - id(v_souff).state) >= 1.0f)
              { id(regul_ecrit) = true; id(v_souff).make_call().set_value(vs).perform(); id(regul_ecrit) = false; }
          }

  - interval: 1h
    then:
      - lambda: |-
          id(filtre_heures) += 1;
      - component.update: filtre_jours

# ---------------------------------------------------------------------
#  Commande des 2 moteurs ebm-papst — sorties ANALOGIQUES (DAC) GPIO25/26
#  Étage : GPIO -[4,7k]- base 2N2222 ; collecteur = fil JAUNE moteur ;
#          émetteur -[2 x 4,7k en parallèle]- GND ; fil BLEU moteur = GND.
#  DAC 0 V  -> transistor bloqué -> fil jaune à 10 V -> pleine vitesse.
#  DAC haut -> transistor conduit -> tension du jaune baisse -> moteur ralentit
#                                    (trop bas = ARRÊT du moteur !)
#  inverted: true -> niveau 1.0 = DAC 0 V = 100 %
#  PHASE D'ÉTALONNAGE : curseurs bruts 0-100 %, à recaler après mesures.
# ---------------------------------------------------------------------
output:
  - platform: esp32_dac
    id: pwm_souff
    pin: GPIO25
    inverted: true
  - platform: esp32_dac
    id: pwm_extr
    pin: GPIO26
    inverted: true

# Débit estimé : débit de soufflage à 100 % (utilisé tant qu'aucun point d'étalonnage n'est saisi), à régler depuis la page web de l'ESP
number:
