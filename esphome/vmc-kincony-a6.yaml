# Board: KinCony KC868-A6
# Definition: definitions/boards/kincony_kc868_a6/manifest.yaml

# =====================================================================
#  VMC Duocosy HR HY — pilotage complet sur KinCony KC868-A6 (ESP32)
#  Version préparée le 15/11/2026 — à flasher à réception de la carte
#
#  Appareil "vmc" créé dans ESPHome Builder : garder la clé API, le mot de
#  passe du point d'accès et la section wifi générés par le Builder.
#
#  CÂBLAGE (bornier basse tension du haut) :
#    DA-1  -> fil JAUNE moteur SOUFFLAGE      (0-10 V)
#    DA-2  -> fil JAUNE moteur EXTRACTION     (0-10 V)
#    GND   -> fils BLEUS des 2 moteurs (à côté de DA-1/DA-2)
#    Fils ROUGES (+10 V) des moteurs : NON utilisés, isolés (WAGO ou gaine),
#    retirer les résistances des WAGO.
#    A1    -> fil JAUNE Huba (signal 0,5-4,5 V), sans pont diviseur
#    GND   -> fil VERT Huba
#    +12 V -> fil BLEU Huba, pris sur l'arrivée +12 V de la carte (bornier alim)
#    IO-1  -> DATA des 4 sondes DS18B20 ; alim sondes sur la borne d'alim
#             capteurs voisine + GND
#  RELAIS (bornier 230 V du bas) — câblés sur contact NF (NC) :
#    Relais 1 : phase L moteur SOUFFLAGE   (COM = arrivée L, NC = départ moteur)
#    Relais 2 : phase L moteur EXTRACTION
#    Relais non alimenté = moteur en marche (sécurité si la carte tombe en panne)
#    Relais 3 : by-pass 230 V à rappel ressort : COM = phase L, NO = fil phase actionneur,
#               neutre de l'actionneur en direct. Hors tension = fermé (récupération).
#  ALIMENTATION : 12 V DC, 1 A mini, sur le bornier +12V / GND de la carte.
# =====================================================================

substitutions:
  # Réglages fixes (non modifiables depuis Home Assistant)
  antigel_seuil: "1.0"     # antigel : T rejet mini (°C)
  antigel_max: "40.0"      # antigel : baisse maxi du soufflage (%)
  filtre_seuil: "180"      # filtres : durée avant changement (jours)
  pi_gain: "0.05"          # régulation pression : réactivité (%/Pa)
  delta_min: "6.0"        # écart T_rep - T_ext mini pour un rendement exploitable (°C)
  # Échelle des sorties 0-10 V : mesurer au Fluke DA-1 à 100 % et ajuster
  # (ex. 10,4 V mesurés -> 10 / 10,4 = 0.96)
  dac_echelle: "1.0"
  # Échelle de l'entrée analogique A1 (0-5 V carte -> 0-3,3 V ESP) : à étalonner
  # en comparant "Capteur pression – tension" avec le Fluke sur le fil jaune du Huba
  ai_echelle: "1.52"

esphome:
  name: vmc
  friendly_name: VMC
  on_boot:
    priority: -100
    then:
      - component.update: filtre_jours
      - lambda: id(regul_ecrit) = true;
      - number.set:
          id: v_souff
          value: !lambda return id(v_souff).state;
      - number.set:
          id: v_extr
          value: !lambda return id(v_extr).state;
      - lambda: id(regul_ecrit) = false;

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret vmc_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "VMC Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------------
#  Page web locale : http://<adresse-IP-de-l-ESP>  (ou http://NOM.local)
#  Fonctionne sans Home Assistant ni Internet.
# ---------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  # local: false (par défaut) : nécessaire pour que js_include soit chargé.
  # Le schéma est servi par l'ESP et marche sans Internet ; seule la page
  # de configuration ESPHome (bouton Configurer) charge son interface depuis Internet.
  js_include: "vmc_synoptique.js"   # schéma de la VMC (fichier à placer dans /config/esphome/)
  # auth:                # à activer pour un client :
  #   username: admin
  #   password: "choisir_un_mot_de_passe"
  sorting_groups:
    - id: grp_temp
      name: "Températures"
      sorting_weight: 10
    - id: grp_perf
      name: "Performances"
      sorting_weight: 20
    - id: grp_cmd
      name: "Commande ventilateurs"
      sorting_weight: 30
    - id: grp_regul
      name: "Régulation automatique"
      sorting_weight: 35
    - id: grp_alert
      name: "Alertes et filtres"
      sorting_weight: 40
    - id: grp_bypass
      name: "By-pass (free-cooling)"
      sorting_weight: 45
    - id: grp_debits
      name: "Étalonnage des débits"
      sorting_weight: 48
    - id: grp_reglages
      name: "Réglages"
      sorting_weight: 50
    - id: grp_sondes
      name: "Sondes – affectation"
      sorting_weight: 55
    - id: grp_diag
      name: "Diagnostic"
      sorting_weight: 60

# ---------------- Bus de la carte KinCony ----------------
i2c:
  sda: GPIO4
  scl:
    number: GPIO15
    ignore_strapping_warning: true

pcf8574:
  - id: entrees
    address: 0x22
  - id: sorties
    address: 0x24

one_wire:
  - platform: gpio
    pin: GPIO32          # borne IO-1

# ---------------------------------------------------------------------
#  Compteur filtres : heures d'utilisation depuis le dernier changement
# ---------------------------------------------------------------------
# Heure : celle de Home Assistant, sinon Internet (SNTP) si l'ESP tourne seul.
# Sert à dater les remises à zéro (énergie, filtres).
time:
  - platform: homeassistant
    id: horloge
  - platform: sntp
    id: horloge_sntp

globals:
  - id: energie_depuis     # date (epoch) de la dernière remise à zéro de l'énergie
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: filtres_depuis     # date (epoch) du dernier changement de filtres
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: antigel_red        # réduction du soufflage par l'antigel (%)
    type: float
    restore_value: false
    initial_value: '0'
  - id: regul_ecrit        # vrai quand c'est la régulation (et non l'utilisateur) qui bouge un curseur
    type: bool
    initial_value: 'false'
  - id: pi_mem_err
    type: float
    initial_value: '0'
  - id: filtre_heures
    type: uint32_t
    restore_value: true
    initial_value: '0'

script:
  - id: appliquer_moteurs        # recalcule les sorties 0-10 V (après un changement d'antigel)
    then:
      - lambda: id(regul_ecrit) = true;
      - number.set:
          id: v_souff
          value: !lambda return id(v_souff).state;
      - number.set:
          id: v_extr
          value: !lambda return id(v_extr).state;
      - lambda: id(regul_ecrit) = false;
  # Free-cooling (principe Atlantic 24 °C / 12 °C) :
  # ouvre si la maison est trop chaude ET que l'air neuf est plus frais (mais pas trop froid).
  - id: bypass_regul
    mode: restart
    then:
      - lambda: |-
          // 0 = Automatique, 1 = Forcé fermé, 2 = Forcé ouvert
          auto idx = id(bp_mode).active_index();
          int m = idx.has_value() ? (int) *idx : 1;
          bool ouvrir = id(relais_bypass).state;
          if (m == 2) ouvrir = true;
          else if (m == 1) ouvrir = false;
          else {
            float tr = id(t_rep).state, te = id(t_ext).state;
            if (isnan(tr) || isnan(te)) ouvrir = false;          // sonde absente : fermé
            else if (!ouvrir) {
              ouvrir = tr > id(bp_t_rep).state
                    && te > id(bp_t_ext_min).state
                    && te < tr - id(bp_ecart).state;
            } else {                                              // hystérésis 1 °C
              ouvrir = tr > id(bp_t_rep).state - 1.0f
                    && te > id(bp_t_ext_min).state - 1.0f
                    && te < tr - id(bp_ecart).state + 0.5f;
            }
          }
          if (ouvrir != id(relais_bypass).state) {
            if (ouvrir) id(relais_bypass).turn_on(); else id(relais_bypass).turn_off();
            ESP_LOGI("bypass", "By-pass %s (mode %d)", ouvrir ? "OUVERT" : "FERME", m);
          }

interval:
  # ---------- Antigel progressif ----------
  # T rejet sous le seuil -> on baisse le soufflage de 5 % par minute (jusqu'à la baisse maxi)
  # et on augmente l'extraction. On revient de 5 %/min quand T rejet repasse 2 °C au-dessus.
  - interval: 1min
    then:
      - lambda: |-
          float tr = id(t_rejet).state;
          if (isnan(tr)) return;
          float r = id(antigel_red);
          if (tr < ${antigel_seuil}) r += 5;
          else if (tr > ${antigel_seuil} + 2.0f) r -= 5;
          if (r > ${antigel_max}) r = ${antigel_max};
          if (r < 0) r = 0;
          if (r != id(antigel_red)) {
            id(antigel_red) = r;
            ESP_LOGW("antigel", "T rejet %.1f °C -> soufflage -%.0f %%", tr, r);
            id(appliquer_moteurs).execute();
          }
  # ---------- Extraction à pression constante (régulateur PI incrémental) ----------
  # Pression trop basse (bouches qui s'ouvrent) -> on accélère ; trop haute -> on ralentit.
  - interval: 5s
    then:
      - lambda: |-
          // Mode de ventilation : 0 = Manuel, 1 = Éco, 2 = Confort, 3 = Boost
          auto mv = id(mode_ventil).active_index();
          int md = mv.has_value() ? (int) *mv : 2;
          if (md == 0) { id(pi_mem_err) = 0; return; }           // Manuel : vitesse d'extraction fixe
          float p = id(p_extraction).state;
          if (isnan(p)) return;                                  // capteur absent : on ne touche à rien
          float c = md == 1 ? id(consigne_eco).state : (md == 3 ? id(consigne_boost).state : id(consigne_pression).state);
          if (id(relais_bypass).state && id(fc_consigne).state > c) c = id(fc_consigne).state;   // free-cooling (été)
          c += 0.5f * id(antigel_red);                              // antigel : + extraction
          float err = c - p;                                        // >0 : pas assez de dépression
          if (fabsf(err) < 3.0f) err = 0;                         // zone morte ±3 Pa
          float k = ${pi_gain};
          float delta = k * err + 4.0f * k * (err - id(pi_mem_err));   // I + P (forme incrémentale)
          id(pi_mem_err) = err;
          if (delta > 3.0f) delta = 3.0f; if (delta < -3.0f) delta = -3.0f;   // 3 %/5 s maxi
          float v = id(v_extr).state + delta;
          if (v < 10) v = 10; if (v > 100) v = 100;
          if (fabsf(v - id(v_extr).state) >= 0.5f)
            { id(regul_ecrit) = true; id(v_extr).make_call().set_value(roundf(v)).perform(); id(regul_ecrit) = false; }
          // Éco / Confort / Boost : le soufflage suit l'extraction (+ écart réglable)
          {
            float vs = roundf(v + id(suivi_ecart).state);
            if (vs < 10) vs = 10; if (vs > 100) vs = 100;
            if (fabsf(vs - id(v_souff).state) >= 1.0f)
              { id(regul_ecrit) = true; id(v_souff).make_call().set_value(vs).perform(); id(regul_ecrit) = false; }
          }

  - interval: 5min
    then:
      - script.execute: bypass_regul
  - interval: 1h
    then:
      - lambda: |-
          id(filtre_heures) += 1;
      - component.update: filtre_jours

# ---------------------------------------------------------------------
#  Sorties 0-10 V de la carte (DAC ESP32 + ampli LM258)
#  DA-1 = GPIO26 -> soufflage ; DA-2 = GPIO25 -> extraction
# ---------------------------------------------------------------------
output:
  - platform: esp32_dac
    id: dac_souff
    pin: GPIO26
  - platform: esp32_dac
    id: dac_extr
    pin: GPIO25

# ---------------------------------------------------------------------
#  Relais de coupure 230 V (câblés en NF) : ON = moteur COUPÉ
# ---------------------------------------------------------------------
switch:
  - platform: gpio
    id: coupure_souff
    name: "Coupure moteur soufflage"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 3
    icon: mdi:fan-off
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: sorties
      number: 0
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: coupure_extr
    name: "Coupure moteur extraction"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 4
    icon: mdi:fan-off
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: sorties
      number: 1
      mode: OUTPUT
      inverted: true

  # Relais 3 : commande du by-pass (contact sec : peut commuter du 12 V ou du 230 V)
  # ON = by-pass OUVERT (air neuf qui contourne l'échangeur). Si ton actionneur
  # fonctionne à l'inverse, mettre "inverted: false" ci-dessous.
  - platform: gpio
    id: relais_bypass
    name: "By-pass (relais)"
    web_server:
      sorting_group_id: grp_bypass
      sorting_weight: 5
    icon: mdi:valve
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: sorties
      number: 2
      mode: OUTPUT
      inverted: true

number:
  - platform: template
    id: etal_qs25
    name: "Débit soufflage mesuré à 25 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 1
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qs50
    name: "Débit soufflage mesuré à 50 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 2
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qs75
    name: "Débit soufflage mesuré à 75 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 3
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qs100
    name: "Débit soufflage mesuré à 100 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 4
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe25
    name: "Débit extraction mesuré à 25 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 5
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe50
    name: "Débit extraction mesuré à 50 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 6
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe75
    name: "Débit extraction mesuré à 75 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 7
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: etal_qe100
    name: "Débit extraction mesuré à 100 %"
    web_server:
      sorting_group_id: grp_debits
      sorting_weight: 8
    unit_of_measurement: "m³/h"
    mode: box
    min_value: 0
    max_value: 400
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: fc_consigne
    name: "Consigne dépression free-cooling (été)"
    web_server:
      sorting_group_id: grp_bypass
      sorting_weight: 6
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 160
    restore_value: true
    optimistic: true
    entity_category: config
  # Consignes de dépression par mode (mesurées au caisson, capteur Huba).
  # Bouches hygro B : 80-160 Pa à la bouche ; les gaines font perdre quelques Pa.
  - platform: template
    id: consigne_eco
    name: "Consigne dépression – Éco (nuit)"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 2.1
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 90
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: consigne_pression
    name: "Consigne dépression – Confort"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 2.2
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 125
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: consigne_boost
    name: "Consigne dépression – Boost"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 2.3
    unit_of_measurement: "Pa"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 170
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: suivi_ecart
    name: "Soufflage – écart / extraction"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 5
    unit_of_measurement: "%"
    min_value: -30
    max_value: 30
    step: 1
    initial_value: -5
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: bp_t_rep
    name: "By-pass – ouverture si reprise >"
    web_server:
      sorting_group_id: grp_bypass
      sorting_weight: 2
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 30
    step: 0.5
    initial_value: 24
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: bp_t_ext_min
    name: "By-pass – air neuf mini"
    web_server:
      sorting_group_id: grp_bypass
      sorting_weight: 3
    unit_of_measurement: "°C"
    min_value: 8
    max_value: 20
    step: 0.5
    initial_value: 12
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: bp_ecart
    name: "By-pass – écart mini reprise/air neuf"
    web_server:
      sorting_group_id: grp_bypass
      sorting_weight: 4
    unit_of_measurement: "°C"
    min_value: 1
    max_value: 6
    step: 0.5
    initial_value: 2
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: debit
    name: "Débit estimé"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 1
    unit_of_measurement: "m³/h"
    min_value: 40
    max_value: 280
    step: 5
    initial_value: 120
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: prix_kwh
    name: "Prix du kWh électrique"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 4
    unit_of_measurement: "€/kWh"
    mode: box
    min_value: 0.05
    max_value: 1.0
    step: 0.001
    initial_value: 0.21
    restore_value: true
    optimistic: true
    entity_category: config

  - platform: template
    id: cop_chauffage
    # 1 = radiateurs électriques ; 3-4 = clim / PAC air-air ; 3 = PAC air-eau ;
    # poêle à granulés : 0,9 et mettre le prix du kWh granulés dans "Prix du kWh électrique"
    name: "COP du chauffage remplacé"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 5
    mode: box
    min_value: 1
    max_value: 6
    step: 0.1
    initial_value: 3.5
    restore_value: true
    optimistic: true
    entity_category: config

  # 10 % = 1 V ... 100 % = 10 V sur le fil jaune
  - platform: template
    id: v_souff
    name: "Vitesse soufflage"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 1
    icon: mdi:fan
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          // curseur bougé à la main en Éco/Confort/Boost -> passage en Manuel (et il y reste)
          if (!id(regul_ecrit)) {
            auto m = id(mode_ventil).active_index();
            if (m.has_value() && *m != 0)
              id(mode_ventil).make_call().set_option("Manuel").perform();
          }
      - output.set_level:
          id: dac_souff
          level: !lambda |-
            float pct = x - id(antigel_red);                 // antigel : soufflage réduit
            if (pct < 10) pct = 10;
            float l = pct / 100.0f * ${dac_echelle};
            return l > 1.0f ? 1.0f : l;

  - platform: template
    id: v_extr
    name: "Vitesse extraction"
    web_server:
      sorting_group_id: grp_cmd
      sorting_weight: 2
    icon: mdi:fan
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          // curseur bougé à la main pendant une régulation auto -> passage en Manuel (et il y reste)
          if (!id(regul_ecrit)) {
            auto m = id(mode_ventil).active_index();
            if (m.has_value() && *m != 0)
              id(mode_ventil).make_call().set_option("Manuel").perform();
          }
      - output.set_level:
          id: dac_extr
          level: !lambda |-
            float pct = x;
            { auto m = id(mode_ventil).active_index();         // antigel en mode Manuel : + extraction
              if (!m.has_value() || *m == 0) pct = x + 0.5f * id(antigel_red); }
            if (pct > 100) pct = 100;
            float l = pct / 100.0f * ${dac_echelle};
            return l > 1.0f ? 1.0f : l;

select:
