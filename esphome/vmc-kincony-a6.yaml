sensor:
  # ---------- Débits calculés à partir de l'étalonnage (0 = non étalonné) ----------
  - platform: template
    id: q_souff
    name: "Débit soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 9
    icon: mdi:weather-windy
    unit_of_measurement: "m³/h"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // Courbe d'étalonnage : points (vitesse %, débit) saisis (0 = non saisi), interpolation linéaire.
      // En dehors des points : proportionnel à la vitesse (loi des ventilateurs) depuis le point le plus proche.
      const float P[4] = {25, 50, 75, 100};
      const float Q[4] = {id(etal_qs25).state, id(etal_qs50).state, id(etal_qs75).state, id(etal_qs100).state};
      float px[4], qy[4]; int n = 0;
      for (int k = 0; k < 4; k++) if (!isnan(Q[k]) && Q[k] > 0) { px[n] = P[k]; qy[n] = Q[k]; n++; }
      float pct = id(v_souff).state - id(antigel_red)   /* vitesse réellement envoyée */;
      if (pct < 10) pct = 10; if (pct > 100) pct = 100;
      if (n == 0) return id(debit).state * pct / 100.0f;   // rien de saisi : débit estimé (= débit à 100 %) × vitesse
      if (pct <= px[0]) return qy[0] * pct / px[0];
      if (pct >= px[n-1]) return qy[n-1] * pct / px[n-1];
      for (int k = 0; k < n - 1; k++)
        if (pct <= px[k+1]) return qy[k] + (pct - px[k]) * (qy[k+1] - qy[k]) / (px[k+1] - px[k]);
      return qy[n-1];
    filters:
      - or:
          - throttle: 300s
          - delta: 2
  - platform: template
    id: q_extr
    name: "Débit extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 10
    icon: mdi:weather-windy
    unit_of_measurement: "m³/h"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // Courbe d'étalonnage : points (vitesse %, débit) saisis (0 = non saisi), interpolation linéaire.
      // En dehors des points : proportionnel à la vitesse (loi des ventilateurs) depuis le point le plus proche.
      const float P[4] = {25, 50, 75, 100};
      const float Q[4] = {id(etal_qe25).state, id(etal_qe50).state, id(etal_qe75).state, id(etal_qe100).state};
      float px[4], qy[4]; int n = 0;
      for (int k = 0; k < 4; k++) if (!isnan(Q[k]) && Q[k] > 0) { px[n] = P[k]; qy[n] = Q[k]; n++; }
      if (n == 0) { float r = id(rapport_debits).state, qs = id(q_souff).state; return (isnan(r) || isnan(qs)) ? NAN : qs * r; }
      float pct = id(v_extr).state;
      if (pct < 10) pct = 10; if (pct > 100) pct = 100;
      if (pct <= px[0]) return qy[0] * pct / px[0];
      if (pct >= px[n-1]) return qy[n-1] * pct / px[n-1];
      for (int k = 0; k < n - 1; k++)
        if (pct <= px[k+1]) return qy[k] + (pct - px[k]) * (qy[k+1] - qy[k]) / (px[k+1] - px[k]);
      return qy[n-1];
    filters:
      - or:
          - throttle: 300s
          - delta: 2
  - platform: template
    name: "Antigel – baisse du soufflage"
    web_server:
      sorting_group_id: grp_regul
      sorting_weight: 9
    icon: mdi:snowflake-melt
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(antigel_red);
  # ---------------- Sondes brutes (ordre de détection sur le bus) ----------------
  # Affectation des rôles depuis la page web / HA (section "Sondes") : chauffer une
  # sonde entre les doigts, repérer laquelle monte, et choisir le bon rôle.
  - platform: dallas_temp
    id: sonde_1
    name: "Sonde 1"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 1
    index: 0
    update_interval: 15s
    entity_category: diagnostic
  - platform: dallas_temp
    id: sonde_2
    name: "Sonde 2"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 2
    index: 1
    update_interval: 15s
    entity_category: diagnostic
  - platform: dallas_temp
    id: sonde_3
    name: "Sonde 3"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 3
    index: 2
    update_interval: 15s
    entity_category: diagnostic
  - platform: dallas_temp
    id: sonde_4
    name: "Sonde 4"
    web_server:
      sorting_group_id: grp_sondes
      sorting_weight: 4
    index: 3
    update_interval: 15s
    entity_category: diagnostic

  # ---------------- Températures par rôle (selon l'affectation) ----------------
  - platform: template
    id: t_ext
    name: "T air neuf (extérieur)"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_ext).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_insuf
    name: "T insufflation"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_insuf).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_rep
    name: "T reprise (air extrait)"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_rep).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1
  - platform: template
    id: t_rejet
    name: "T rejet"
    web_server:
      sorting_group_id: grp_temp
      sorting_weight: 4
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      auto i = id(sel_rejet).active_index();
      if (!i.has_value()) return NAN;
      switch (*i) {
        case 0: return id(sonde_1).state;
        case 1: return id(sonde_2).state;
        case 2: return id(sonde_3).state;
        case 3: return id(sonde_4).state;
      }
      return NAN;
    filters:
      - or:
          - throttle: 60s
          - delta: 0.1

  # ---------------- Diagnostic ----------------
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 2
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Temps de fonctionnement"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 3
    entity_category: diagnostic

  # ---------------- Capteur de pression Huba (réseau d'extraction) ----------------
  # Sortie 0,5-4,5 V = 0-300 Pa, branchée directement sur A1 (GPIO36), alimenté en 12 V
  - platform: adc
    id: huba_v
    pin: GPIO36          # borne A1
    name: "Capteur pression – tension"
    web_server:
      sorting_group_id: grp_diag
      sorting_weight: 1
    attenuation: 12db
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: ${ai_echelle}
      - sliding_window_moving_average:
          window_size: 6
          send_every: 3

  - platform: template
    id: p_extraction
    name: "Pression réseau extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 6
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float v = id(huba_v).state;
      if (isnan(v) || v > 5.2f) return NAN;
      float p = (v - 0.5f) / 4.0f * 300.0f;       // 0,5-4,5 V -> 0-300 Pa
      return p < 0 ? 0.0f : p;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    id: filtre_jours
    name: "Filtres – jours d'utilisation"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 5
    unit_of_measurement: "j"
    icon: mdi:air-filter
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return id(filtre_heures) / 24.0f;

  - platform: template
    id: eta_souff
    name: "Rendement côté soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 2
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      return 100.0f * (id(t_insuf).state - id(t_ext).state) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    id: eta_extr
    name: "Rendement côté extraction"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 3
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      return 100.0f * (id(t_rep).state - id(t_rejet).state) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  - platform: template
    name: "Rendement moyen 1 h"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 1
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(eta_souff).state;
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 60
          send_every: 5

  # Écart entre les deux rendements : indicateur de déséquilibre / encrassement d'un côté
  - platform: template
    name: "Écart rendements"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 4
    unit_of_measurement: "pts"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      float gain  = id(t_insuf).state - id(t_ext).state;
      float perte = id(t_rep).state - id(t_rejet).state;
      return 100.0f * (gain - perte) / d;
    filters:
      - or:
          - throttle: 300s
          - delta: 1

  # Rapport des débits extraction / soufflage, par bilan thermique de l'échangeur
  # 1,0 = équilibré ; > 1 = plus d'extraction que de soufflage (maison en dépression)
  - platform: template
    id: rapport_debits
    name: "Rapport débits extraction sur soufflage"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 5
    icon: mdi:scale-balance
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 15s
    lambda: |-
      float d = id(t_rep).state - id(t_ext).state;
      if (isnan(d) || d < ${delta_min}) return NAN;
      float gain  = id(t_insuf).state - id(t_ext).state;
      float perte = id(t_rep).state - id(t_rejet).state;
      if (isnan(gain) || isnan(perte) || perte < 0.5f) return NAN;
      return gain / perte;
    filters:
      - sliding_window_moving_average:
          window_size: 20
          send_every: 4

  - platform: template
    id: p_recup
    name: "Puissance récupérée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 7
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      // P ≈ 0,34 × Q_soufflage (étalonné) × (T_insuf - T_ext)
      float p = 0.34f * id(q_souff).state * (id(t_insuf).state - id(t_ext).state);
      return p > 0 ? p : 0.0f;
    filters:
      - or:
          - throttle: 300s
          - delta: 5

  - platform: integration
    id: e_recup
    sensor: p_recup
    name: "Énergie récupérée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 8
    time_unit: h
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    restore: true

  # Économie : chaleur récupérée = chauffage évité. Électricité évitée = énergie récupérée / COP
  # du chauffage remplacé (1 = radiateurs, 3-4 = clim/PAC), multipliée par le prix du kWh.
  # Calculée sur toute l'énergie récupérée : se recalcule si le prix ou le COP change.
  - platform: template
    id: eco_euros
    name: "Économie estimée"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 8.5
    icon: mdi:piggy-bank-outline
    unit_of_measurement: "€"
    accuracy_decimals: 2
    device_class: monetary
    state_class: total
    update_interval: 60s
    lambda: |-
      float e = id(e_recup).state, cop = id(cop_chauffage).state, prix = id(prix_kwh).state;
      if (isnan(e) || isnan(cop) || cop < 1 || isnan(prix)) return NAN;
      return e / 1000.0f / cop * prix;      // e_recup est en Wh

binary_sensor:
  - platform: template
    name: "Antigel actif"
    device_class: cold
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 0
    lambda: return id(antigel_red) > 0;
  - platform: template
    name: "Risque givrage échangeur"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 2
    device_class: cold
    lambda: |-
      return id(t_rejet).state < 1.0f;
    filters:
      - delayed_on: 5min

  - platform: template
    name: "Air soufflé froid"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 1
    device_class: cold
    lambda: |-
      return id(t_insuf).state < 15.0f;
    filters:
      - delayed_on: 10min


  - platform: template
    name: "Filtres à changer"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 4
    device_class: problem
    icon: mdi:air-filter
    lambda: |-
      return (id(filtre_heures) / 24.0f) >= ${filtre_seuil};

text_sensor:
  # Aide affichée sous les réglages d'économie (page web de l'ESP et Home Assistant)
  - platform: template
    name: "COP – aide au réglage"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 6
    icon: mdi:help-circle-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"Radiateurs électriques : 1 | Clim ou PAC air/air : 3 à 4 | PAC air/eau : 3 | Poêle à granulés : 0,9 avec le prix du kWh granulés (≈ 0,08 €)"};

  - platform: template
    id: txt_energie_depuis
    name: "Énergie récupérée – comptée depuis le"
    web_server:
      sorting_group_id: grp_perf
      sorting_weight: 8.7
    icon: mdi:calendar-start
    update_interval: 10min
    lambda: |-
      if (id(energie_depuis) == 0) return {"début non daté"};
      return ESPTime::from_epoch_local(id(energie_depuis)).strftime("%d/%m/%Y à %Hh%M");

  - platform: template
    id: txt_filtres_depuis
    name: "Filtres – changés le"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 5.5
    icon: mdi:calendar-check
    update_interval: 10min
    lambda: |-
      if (id(filtres_depuis) == 0) return {"date inconnue"};
      return ESPTime::from_epoch_local(id(filtres_depuis)).strftime("%d/%m/%Y");

button:
  - platform: template
    name: "Remise à zéro énergie récupérée"
    web_server:
      sorting_group_id: grp_reglages
      sorting_weight: 3
    entity_category: config
    on_press:
      - sensor.integration.reset: e_recup
      - lambda: |-
          auto t = id(horloge).now();
          if (!t.is_valid()) t = id(horloge_sntp).now();
          id(energie_depuis) = t.is_valid() ? (uint32_t) t.timestamp : 0;
          global_preferences->sync();
      - component.update: txt_energie_depuis

  - platform: template
    name: "Filtres changés (remise à zéro)"
    web_server:
      sorting_group_id: grp_alert
      sorting_weight: 6
    icon: mdi:air-filter
    on_press:
      - lambda: |-
          id(filtre_heures) = 0;
          auto t = id(horloge).now();
          if (!t.is_valid()) t = id(horloge_sntp).now();
          id(filtres_depuis) = t.is_valid() ? (uint32_t) t.timestamp : 0;
          global_preferences->sync();
      - component.update: filtre_jours
      - component.update: txt_filtres_depuis

