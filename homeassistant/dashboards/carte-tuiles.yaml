type: grid
cards:
  - type: heading
    heading: VMC double flux
    heading_style: subtitle
    icon: mdi:air-filter

  # ---------- Bilan ----------
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Rendement
        secondary: >-
          {% set s = states('sensor.vmc_rendement_moyen_1_h') %}
          {{ (s | float | round(0) | int) ~ ' % (1 h)' if is_number(s) else '—' }}
        icon: mdi:recycle-variant
        icon_color: >-
          {% set v = states('sensor.vmc_rendement_moyen_1_h') | float(0) %}
          {{ 'green' if v >= 70 else 'amber' if v >= 50 else 'red' }}
        entity: sensor.vmc_rendement_moyen_1_h
      - type: custom:mushroom-template-card
        primary: Puissance
        secondary: >-
          {% set s = states('sensor.vmc_puissance_recuperee') %}
          {{ (s | float | round(0) | int) ~ ' W' if is_number(s) else '—' }}
        icon: mdi:lightning-bolt
        icon_color: blue
        entity: sensor.vmc_puissance_recuperee
      - type: custom:mushroom-template-card
        primary: Énergie
        secondary: >-
          {% set s = states('sensor.vmc_energie_recuperee') %}
          {{ ((s | float / 1000) | round(2)) ~ ' kWh' if is_number(s) else '—' }}
        icon: mdi:battery-charging-high
        icon_color: green
        entity: sensor.vmc_energie_recuperee
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.vmc_remise_a_zero_energie_recuperee
          confirmation:
            text: Remettre à zéro l'énergie récupérée ?

  # ---------- Températures ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Air neuf (extérieur)
        secondary: >-
          {% set s = states('sensor.vmc_t_air_neuf_exterieur') %}
          {{ (s | float | round(1)) ~ ' °C' if is_number(s) else 'indisponible' }}
        icon: mdi:thermometer-low
        icon_color: >-
          {% set v = states('sensor.vmc_t_air_neuf_exterieur') | float(15) %}
          {{ 'blue' if v < 12 else 'amber' if v < 22 else 'red' }}
        entity: sensor.vmc_t_air_neuf_exterieur
      - type: custom:mushroom-template-card
        primary: Insufflation
        secondary: >-
          {% set s = states('sensor.vmc_t_insufflation') %}
          {{ (s | float | round(1)) ~ ' °C' if is_number(s) else 'indisponible' }}
        icon: mdi:thermometer
        icon_color: >-
          {% set v = states('sensor.vmc_t_insufflation') | float(18) %}
          {{ 'blue' if v < 15 else 'amber' if v < 24 else 'red' }}
        entity: sensor.vmc_t_insufflation
      - type: custom:mushroom-template-card
        primary: Reprise (air extrait)
        secondary: >-
          {% set s = states('sensor.vmc_t_reprise_air_extrait') %}
          {{ (s | float | round(1)) ~ ' °C' if is_number(s) else 'indisponible' }}
        icon: mdi:thermometer
        icon_color: amber
        entity: sensor.vmc_t_reprise_air_extrait
      - type: custom:mushroom-template-card
        primary: Rejet (vers l'extérieur)
        secondary: >-
          {% set s = states('sensor.vmc_t_rejet') %}
          {{ (s | float | round(1)) ~ ' °C' if is_number(s) else 'indisponible' }}
        icon: mdi:thermometer-high
        icon_color: blue
        entity: sensor.vmc_t_rejet

  # ---------- Équilibre et pression ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Équilibre des débits
        secondary: >-
          {% set s = states('sensor.vmc_rapport_debits_extraction_sur_soufflage') %}
          {% if is_number(s) %}{% set v = s | float %}
          {{ v | round(2) }} – {{ 'équilibré' if v <= 1.1 else 'légère dépression' if v <= 1.3 else 'forte dépression' }}
          {% else %}— (trop doux dehors){% endif %}
        icon: mdi:scale-balance
        icon_color: >-
          {% set v = states('sensor.vmc_rapport_debits_extraction_sur_soufflage') | float(1) %}
          {{ 'green' if v <= 1.1 else 'amber' if v <= 1.3 else 'red' }}
        entity: sensor.vmc_rapport_debits_extraction_sur_soufflage
      - type: custom:mushroom-template-card
        primary: Pression extraction
        secondary: >-
          {% set s = states('sensor.vmc_pression_reseau_extraction') %}
          {{ (s | float | round(0) | int) ~ ' Pa' if is_number(s) else 'indisponible' }}
        icon: mdi:gauge
        icon_color: blue
        entity: sensor.vmc_pression_reseau_extraction

  # ---------- Alertes ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: By-pass
        secondary: >-
          {{ 'Ouvert' if is_state('switch.vmc_by_pass_relais', 'on') else 'Fermé' }}
        icon: mdi:valve
        icon_color: >-
          {{ 'amber' if is_state('switch.vmc_by_pass_relais', 'on') else 'grey' }}
        entity: switch.vmc_by_pass_relais
      - type: custom:mushroom-template-card
        primary: Givrage échangeur
        secondary: >-
          {{ 'RISQUE' if is_state('binary_sensor.vmc_risque_givrage_echangeur', 'on') else 'Normal' }}
        icon: mdi:snowflake-alert
        icon_color: >-
          {{ 'red' if is_state('binary_sensor.vmc_risque_givrage_echangeur', 'on') else 'grey' }}
        entity: binary_sensor.vmc_risque_givrage_echangeur
      - type: custom:mushroom-template-card
        primary: Air soufflé
        secondary: >-
          {{ 'Froid' if is_state('binary_sensor.vmc_air_souffle_froid', 'on') else 'Normal' }}
        icon: mdi:weather-windy
        icon_color: >-
          {{ 'red' if is_state('binary_sensor.vmc_air_souffle_froid', 'on') else 'grey' }}
        entity: binary_sensor.vmc_air_souffle_froid
      - type: custom:mushroom-template-card
        primary: Filtres
        secondary: >-
          {% set j = states('sensor.vmc_filtres_jours_d_utilisation') | float(0) | round(0) | int %}
          {% set s = 365 %}
          {{ j }} / {{ s }} j{{ ' – À CHANGER' if is_state('binary_sensor.vmc_filtres_a_changer', 'on') else '' }}
        icon: mdi:air-filter
        icon_color: >-
          {{ 'red' if is_state('binary_sensor.vmc_filtres_a_changer', 'on') else 'green' }}
        entity: binary_sensor.vmc_filtres_a_changer
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.vmc_filtres_changes_remise_a_zero
          confirmation:
            text: Filtres changés ? Le compteur sera remis à zéro.

  # ---------- Mode de ventilation ----------
  - type: custom:mushroom-select-card
    entity: select.vmc_mode_de_ventilation
    name: Mode de ventilation
    icon: mdi:fan-auto

  # Curseurs des deux ventilateurs : affichés seulement en mode Manuel
  - type: conditional
    conditions:
      - condition: state
        entity: select.vmc_mode_de_ventilation
        state: Manuel
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-number-card
          entity: number.vmc_vitesse_soufflage
          name: Vitesse soufflage
          icon: mdi:fan
          display_mode: buttons
        - type: custom:mushroom-number-card
          entity: number.vmc_vitesse_extraction
          name: Vitesse extraction
          icon: mdi:fan
          display_mode: buttons

  # ---------- Diagnostic ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: En marche depuis
        secondary: >-
          {% set t = states('sensor.vmc_temps_de_fonctionnement') | float(0) | int %}
          {% set j = t // 86400 %}{% set h = (t % 86400) // 3600 %}{% set m = (t % 3600) // 60 %}
          {{ (j ~ ' j ') if j > 0 else '' }}{{ h }} h {{ '%02d' | format(m) }}
        icon: mdi:timer-outline
        icon_color: grey
        entity: sensor.vmc_temps_de_fonctionnement
      - type: custom:mushroom-template-card
        primary: Signal Wi-Fi
        secondary: >-
          {% set s = states('sensor.vmc_signal_wi_fi') %}
          {{ (s | float | int) ~ ' dBm' if is_number(s) else 'indisponible' }}
        icon: mdi:wifi
        icon_color: >-
          {% set v = states('sensor.vmc_signal_wi_fi') | float(-100) %}
          {{ 'green' if v > -60 else 'amber' if v > -75 else 'red' }}
        entity: sensor.vmc_signal_wi_fi
