alias: VMC – Soufflage réduit la nuit
description: 70 % de 22 h à 6 h (silence chambres), 100 % le jour
mode: restart
triggers:
  - trigger: time
    at: "22:00:00"
  - trigger: time
    at: "06:00:00"
  - trigger: homeassistant
    event: start
actions:
  - choose:
      - conditions:
          - condition: time
            after: "22:00:00"
            before: "06:00:00"
        sequence:
          - action: number.set_value
            target:
              entity_id: number.vmc_vitesse_soufflage
            data:
              value: 70
    default:
      - action: number.set_value
        target:
          entity_id: number.vmc_vitesse_soufflage
        data:
          value: 100
